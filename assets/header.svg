<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-labelledby="t d">
  <title id="t">Matheus Morais</title>
  <desc id="d">Developer from Brazil and founder of Crimson Core, an independent technology studio.</desc>
  <defs>
    <radialGradient id="core" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ff3c5f" stop-opacity="0.75"/>
      <stop offset="0.25" stop-color="#b51235" stop-opacity="0.5"/>
      <stop offset="0.6" stop-color="#780d25" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#780d25" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="wash" cx="0.1" cy="0" r="0.8">
      <stop offset="0" stop-color="#780d25" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#780d25" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="chrome" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.45" stop-color="#e6e8eb"/>
      <stop offset="0.8" stop-color="#a7acb3"/>
      <stop offset="1" stop-color="#d9dce0"/>
    </linearGradient>
    <linearGradient id="crimson" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff7a90"/>
      <stop offset="1" stop-color="#e5385b"/>
    </linearGradient>
    <linearGradient id="seam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#b51235" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#ff4d6d"/>
      <stop offset="1" stop-color="#b51235" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#f0f1f2" stroke-opacity="0.035"/>
    </pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="frame"><rect width="1200" height="380" rx="18"/></clipPath>
  </defs>

  <style>
    .mono { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; letter-spacing: 3px; }
    .sans { font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; }
    .spin { transform-origin: 900px 190px; animation: spin 60s linear infinite; }
    .spin-r { transform-origin: 900px 190px; animation: spin 28s linear infinite reverse; }
    .breathe { animation: breathe 6s ease-in-out infinite alternate; }
    .blink { animation: blink 1.1s steps(1) infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes breathe { from { opacity: 0.7; } to { opacity: 1; } }
    @keyframes blink { 50% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) {
      .spin, .spin-r, .breathe, .blink { animation: none; }
    }
  </style>

  <g clip-path="url(#frame)">
    <rect width="1200" height="380" fill="#08090b"/>
    <rect width="1200" height="380" fill="url(#wash)"/>
    <rect width="1200" height="380" fill="url(#grid)"/>

    <!-- light from the core -->
    <circle class="breathe" cx="900" cy="190" r="300" fill="url(#core)"/>

    <!-- calibration dial -->
    <g fill="none" stroke="#f0f1f2">
      <circle cx="900" cy="190" r="150" stroke-opacity="0.08"/>
      <g class="spin">
        <circle cx="900" cy="190" r="132" stroke-opacity="0.22" stroke-dasharray="2 9"/>
        <rect x="896" y="54" width="8" height="8" fill="#b51235" stroke="none"/>
      </g>
      <g class="spin-r">
        <circle cx="900" cy="190" r="108" stroke-opacity="0.12"/>
        <circle cx="900" cy="190" r="108" stroke="#ff4d6d" stroke-width="2" stroke-linecap="round" pathLength="100" stroke-dasharray="16 84" filter="url(#glow)"/>
        <circle cx="900" cy="190" r="108" stroke="#ff4d6d" stroke-width="2" stroke-linecap="round" pathLength="100" stroke-dasharray="5 95" stroke-dashoffset="-50" opacity="0.7"/>
      </g>
      <circle cx="900" cy="190" r="78" stroke-opacity="0.1"/>
      <path d="M900 30v26M900 324v26M740 190h26M1034 190h26" stroke-opacity="0.25"/>
    </g>
    <circle cx="900" cy="190" r="34" fill="#b51235" opacity="0.9" filter="url(#glow)"/>
    <circle cx="900" cy="190" r="16" fill="#ff5a78"/>
    <circle cx="900" cy="190" r="6" fill="#fff" opacity="0.85"/>

    <!-- dial labels -->
    <g class="mono" font-size="10" fill="#92969d">
      <text x="906" y="26">000</text>
      <text x="1064" y="186">090</text>
      <text x="906" y="364">180</text>
      <text x="1104" y="40" text-anchor="end">MM / CORE</text>
    </g>

    <!-- copy -->
    <rect x="64" y="86" width="8" height="8" fill="#b51235" filter="url(#glow)"/>
    <text x="84" y="95" class="mono" font-size="13" fill="#c5c9ce">DEVELOPER · BRAZIL</text>

    <text x="62" y="176" class="sans" font-size="72" font-weight="700" letter-spacing="-2.5" fill="url(#chrome)">Matheus Morais</text>

    <text x="64" y="226" class="sans" font-size="22" fill="#c5c9ce">Founder of <tspan fill="url(#crimson)" font-weight="700">Crimson Core</tspan> — an independent technology studio.</text>
    <text x="64" y="258" class="sans" font-size="22" fill="#92969d">Desktop software, platforms and websites, built end to end.</text>

    <text x="64" y="318" class="mono" font-size="13" fill="#e5385b">&gt;<tspan fill="#92969d"> building: aurora studio · cultlists · solaris</tspan><tspan class="blink" fill="#e5385b"> _</tspan></text>

    <rect x="300" y="379" width="600" height="1" fill="url(#seam)"/>
  </g>
  <rect x="0.5" y="0.5" width="1199" height="379" rx="18" fill="none" stroke="#f0f1f2" stroke-opacity="0.08"/>
</svg>
